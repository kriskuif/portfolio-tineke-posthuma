name: Bump portfolio files cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump-cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update portfolio-files cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = 'portfolio-files.js?v=20260914-1335'
          new = 'portfolio-files.js?v=20260928-docx-preview-2'
          if old not in text:
              print('Cache version already updated or source changed.')
              raise SystemExit(0)
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit cache version
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bust portfolio files cache for DOCX preview'
          git push
